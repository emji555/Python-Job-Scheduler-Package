[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "package-name"
version = "0.1.0"
description = "Laravel-inspired jobs, queues, scheduling and monitoring for Python — framework and backend agnostic."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "PACKAGE_NAME Maintainers", email = "maintainers@example.com" },
]
keywords = [
  "jobs",
  "queues",
  "scheduler",
  "celery",
  "background-tasks",
  "retries",
  "middleware",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1",
  "croniter>=2.0",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
redis = ["redis>=8.1.0"]
celery = ["celery>=5.3", "redis>=8.1.0"]
django = ["django>=4.2"]
fastapi = ["fastapi>=0.110", "uvicorn>=0.27"]
flask = ["flask>=3.0"]
otel = ["opentelemetry-api>=1.24"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "build>=1.2",
  "twine>=5.1",
  "types-croniter",
  "types-redis",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]
all = [
  "package-name[redis,celery,django,fastapi,flask,otel]",
]

[project.urls]
Homepage = "https://github.com/EXAMPLE_ORG/package-name"
Documentation = "https://EXAMPLE_ORG.github.io/package-name/"
Repository = "https://github.com/EXAMPLE_ORG/package-name"
Issues = "https://github.com/EXAMPLE_ORG/package-name/issues"
Changelog = "https://github.com/EXAMPLE_ORG/package-name/blob/main/CHANGELOG.md"

[project.scripts]
package-name = "package_name.cli.main:main"

[project.entry-points."package_name.backends"]
eager = "package_name.backends.eager:EagerBackend"
memory = "package_name.backends.memory:MemoryBackend"
celery = "package_name.backends.celery:CeleryBackend"

[project.entry-points."package_name.schedulers"]
inprocess = "package_name.schedulers.inprocess:InProcessScheduler"

[project.entry-points."package_name.serializers"]
json = "package_name.serializers.json:JsonSerializer"

[project.entry-points."package_name.storage"]
memory = "package_name.storage.memory:MemoryStorage"

[project.entry-points."package_name.locks"]
memory = "package_name.locks.memory:MemoryLockBackend"
redis = "package_name.locks.redis:RedisLockBackend"

[tool.hatch.build.targets.wheel]
packages = ["src/package_name"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: tests requiring external services",
  "celery: celery backend tests",
  "redis: redis-backed tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "UP035"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
mypy_path = "src"
packages = ["package_name"]
exclude = ["examples/", "benchmarks/", "integrations/"]

[[tool.mypy.overrides]]
module = [
  "celery.*",
  "django.*",
  "fastapi.*",
  "flask.*",
  "redis.*",
  "croniter.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "package_name.integrations.*",
  "package_name.backends.celery",
  "package_name.locks.redis",
  "package_name.cli.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["package_name.pipelines.*"]
disable_error_code = ["no-any-return", "unused-ignore"]

[tool.coverage.run]
branch = true
source = ["package_name"]

[tool.coverage.report]
show_missing = true
skip_covered = false
omit = ["*/integrations/*"]
